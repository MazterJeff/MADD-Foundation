<body></body>
<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library/build/nn.min.js"></script>
<script>

  const url = 'https://storage.googleapis.com/cdn.patatap.com/A/'
  
  // each key is mapped to a sound file and a visual effect
  // ('drop' draws a circle, 'flash' changes the background)
  const keymap = {
    q: ['clay', 'drop'],
    w: ['flash-1', 'flash'],
    e: ['bubbles', 'drop'],
    r: ['confetti', 'drop'],
    t: ['corona', 'flash'],
    y: ['dotted-spiral', 'drop'],
    u: ['flash-2', 'flash'],
    i: ['flash-3', 'flash'],
    o: ['moon', 'drop'],
    p: ['pinwheel', 'flash'],
    a: ['piston-1', 'flash'],
    s: ['piston-2', 'flash'],
    d: ['piston-3', 'flash'],
    f: ['prism-1', 'drop'],
    g: ['prism-2', 'drop'],
    h: ['prism-3', 'drop'],
    j: ['splits', 'flash'],
    k: ['squiggle', 'drop'],
    l: ['strike', 'flash'],
    z: ['suspension', 'drop'],
    x: ['timer', 'flash'],
    c: ['ufo', 'drop'],
    v: ['veil', 'flash'],
    b: ['wipe', 'flash'],
    n: ['zig-zag', 'drop']
  }

  // create an audio element for every sound
  const sounds = {}
  for (const key in keymap) {
    const name = keymap[key][0]
    sounds[name] = nn.create('audio')
      .set('src', url + name + '.mp3')
      .set('preload', 'auto')
      .addTo('body')
  }

  const svg = nn.create('svg').addTo('body')
  
  nn.get('body')
    .css('background', 'pink')
    .css('margin', 0)
  
  // this "bgFlash" function changes the background color
  // of our page, it will have a random "hue", but always
  // maintain a pastel like tone.
  function bgFlash () {
    const hue = nn.random(0, 360)
    const clr = nn.hsl(hue, 25, 75)
    nn.get('body').css('background', clr)
  }
  
  // this "drop" function is the same code from the previous
  // sketch, we've placed it in it's own function instead
  // of directly in the "play" function to keep our code
  // more modular.
  function drop () {
    const clr = nn.randomColor()
    const x = nn.random(nn.width)
    const y = nn.random(nn.height)
    const r = nn.random(10, 100)
    const circ = svg.circle(x, y, r).fill(clr)
  
    const timing = {
      duration: 600, 
      easing: 'ease-out'
    }
    const keyframes = [
      { r: 0, opacity: 0 },
      { r: r, opacity: 1 },
      { r: r, opacity: 0 }
    ]
    const anim = circ.animate(keyframes, timing)
    anim.onfinish = () => circ.remove()
  }
  
  // depending on which key we press
  // a different visual and sound get triggered
  function play (e) {
    const entry = keymap[e.key.toLowerCase()]
    if (!entry) return
    const sound = sounds[entry[0]]
    sound.currentTime = 0
    sound.play()
    if (entry[1] === 'drop') drop()
    else bgFlash()
  }

  nn.on('keypress', play)

</script>
