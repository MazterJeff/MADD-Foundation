<body></body>
<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library/build/nn.min.js"></script>
<script>

  const url = 'https://storage.googleapis.com/cdn.patatap.com/A/'
  
  // each key is mapped to a sound file and a visual effect
  // ('drop' draws a circle, 'flash' changes the background)
  const keymap = {
    q: ['clay', 'drop'],
    w: ['flash-1', 'flash'],
    e: ['bubbles', 'drop'],
    r: ['confetti', 'drop'],
    t: ['corona', 'flash'],
    y: ['dotted-spiral', 'drop'],
    u: ['flash-2', 'flash'],
    i: ['flash-3', 'flash'],
    o: ['moon', 'drop'],
    p: ['pinwheel', 'flash'],
    a: ['piston-1', 'flash'],
    s: ['piston-2', 'flash'],
    d: ['piston-3', 'flash'],
    f: ['prism-1', 'drop'],
    g: ['prism-2', 'drop'],
    h: ['prism-3', 'drop'],
    j: ['splits', 'flash'],
    k: ['squiggle', 'drop'],
    l: ['strike', 'flash'],
    z: ['suspension', 'drop'],
    x: ['timer', 'flash'],
    c: ['ufo', 'drop'],
    v: ['veil', 'flash'],
    b: ['wipe', 'flash'],
    n: ['zig-zag', 'drop']
  }

  // create an audio element for every sound
  const sounds = {}
  for (const key in keymap) {
    const name = keymap[key][0]
    sounds[name] = nn.create('audio')
      .set('src', url + name + '.mp3')
      .set('preload', 'auto')
      .addTo('body')
  }

  const svg = nn.create('svg')
    .css('position', 'fixed')
    .css('top', 0)
    .css('left', 0)
    .css('width', '100%')
    .css('height', '100%')
    .addTo('body')

  // rice paper white, nothing but black ink on top
  nn.get('body')
    .css('background', '#fff')
    .css('margin', 0)
    .css('overflow', 'hidden')

  // "bgFlash" briefly washes the paper in a grey tone, then
  // lets it fade back to white, like a faint wash of diluted ink
  function bgFlash () {
    const gray = nn.random(85, 94)
    document.body.animate([
      { background: nn.hsl(0, 0, gray) },
      { background: '#fff' }
    ], { duration: 900, easing: 'ease-out' })
  }

  // a single blob of ink: it lands on the paper, bleeds outward
  // as the edges blur and then dissolves into the paper
  function blot (x, y, r, opacity, delay) {
    const ink = svg.circle(x, y, r)
      .fill('#000')
      .css('filter', 'blur(2px)')
    const dur = nn.random(1800, 2800)
    const anim = ink.animate([
      { r: r * 0.2, opacity: 0, filter: 'blur(1px)' },
      { r: r * 0.8, opacity: opacity, filter: 'blur(2px)', offset: 0.1 },
      { r: r, opacity: opacity * 0.6, filter: 'blur(8px)', offset: 0.5 },
      { r: r * 1.5, opacity: 0, filter: 'blur(22px)' }
    ], { duration: dur, delay: delay, easing: 'ease-out', fill: 'backwards' })
    anim.onfinish = () => ink.remove()
  }

  // the "drop" is an ink drop: a dark core with softer
  // translucent rings around it and a few small splatters
  function drop () {
    const x = nn.random(nn.width)
    const y = nn.random(nn.height)
    const r = nn.random(20, 90)
    blot(x, y, r * 1.6, 0.12, 0)
    blot(x, y, r * 1.2, 0.25, 50)
    blot(x, y, r, 0.85, 0)
    const n = nn.random(2, 6)
    for (let i = 0; i < n; i++) {
      const a = nn.random(0, 360) * Math.PI / 180
      const d = r * nn.random(1.2, 2.4)
      blot(x + Math.cos(a) * d, y + Math.sin(a) * d, nn.random(2, r * 0.25), 0.6, nn.random(0, 200))
    }
  }
  
  // depending on which key we press
  // a different visual and sound get triggered
  function play (e) {
    const entry = keymap[e.key.toLowerCase()]
    if (!entry) return
    const sound = sounds[entry[0]]
    sound.currentTime = 0
    sound.play()
    if (entry[1] === 'drop') drop()
    else bgFlash()
  }

  nn.on('keypress', play)

</script>
